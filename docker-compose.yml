# Olkeri's own database — Postgres running on your machine/server.
#
#   POSTGRES_PASSWORD=your-strong-password docker compose up -d
#
# First boot applies db/schema.sql automatically. Data persists in the
# olkeri_pgdata volume. The port is bound to localhost only; if the site
# runs on another host (e.g. Vercel), expose it deliberately (change to
# "5432:5432", keep the strong password, and prefer an SSH tunnel or TLS).
#
# The site then connects with:
#   DATABASE_URL=postgres://olkeri:your-strong-password@<this-server>:5432/olkeri

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: olkeri
      POSTGRES_USER: olkeri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - olkeri_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olkeri -d olkeri']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  olkeri_pgdata:
